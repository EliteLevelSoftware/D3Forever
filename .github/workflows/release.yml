name: Build & Release Diablo 3 Forever

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Single-File EXE (win-x64)
        run: |
          dotnet publish src/Diablo3Forever.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash "publish/Diablo3Forever.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  Diablo3Forever.exe" | Set-Content -Path "publish/SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diablo3Forever-win-x64
          path: |
            publish/Diablo3Forever.exe
            publish/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Diablo3Forever.exe
            publish/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          append_body: false
